name: Documentation Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: Dev

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Dev
        run: |
          echo "Deploying documentation to Dev"

  deploy-beta:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: Beta

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Beta
        run: |
          echo "Deploying documentation to Beta"

  deploy-production:
    needs: deploy-beta
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Production
        run: |
          echo "Deploying documentation to Production"
